# Hugo configuration file
title: 羽咋市英語教育

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: ホーム
      pageRef: /
      weight: 1
    - name: リソース
      pageRef: /resources
      weight: 2
    - name: サイト
      pageRef: /sites
      weight: 3
    - name: ツール
      pageRef: /tools
      weight: 4
    - name: について
      pageRef: /about
      weight: 5
    - name: Search
      weight: 6
      params:
        type: search

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
