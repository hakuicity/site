# Hugo configuration file
title: 羽咋市英語教育

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

#baseurl

baseURL: https://hakuicity.github.io/site/

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: ホーム
      url: /
      weight: 1
    - name: ポータル
      url: /portal/
      weight: 2
        
params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
